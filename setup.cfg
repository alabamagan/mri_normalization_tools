[metadata]
name = mri-normalization-tools
version = 0.4.1
author = ML, Wong
author_email = mat.lun.wong@gmail.com
license = MIT
description =
    A pacakge dedicated for normalization and processing of MRI images.
long_description = file: README.md
long_description_content_type = text/markdown
url =
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Science/Research
    License :: OSI Approved :: Apache Software License
    Natural Language :: English
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Image Processing
    Topic :: Scientific/Engineering :: Medical Science Apps.
    Typing :: Typed

[project.urls]
Homepage=https://github.com/alabamagan/mri_normalization_tools

[options]
packages = find:
python_requires = >=3.7
install_requires =
    SimpleITK >= 2.1.0, <3
    networkx >= 2.5, <4
    cachetools >= 4.2.2, <6
    netgraph >= 4.0.5, <5
    pyyaml >= 5.3.1
    tqdm >= 4.0.0
    pandas >= 1.5.0, <3
    rich >= 13.0, <15
    rich-tools >= 0.5.1
    click >= 8.0.0, <9

[options.extras_require]
dicom =
    pydicom
    pydicom-seg

[options.entry_points]
console_scripts =
    mnts-train = mnts.scripts.normalization:run_graph_train
    mnts-infer = mnts.scripts.normalization:run_graph_inference
    mnts-dicom2nii = mnts.scripts.dicom2nii:console_entry
    mnts-organize = mnts.scripts.organize_nifti:console_entry
    mnts-dcm-tagprint = mnts.scripts.dicom_tag_printer:dicom_tag_printer_cli

[bdist_wheel]
python-tag = py3